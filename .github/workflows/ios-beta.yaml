name: iOS Beta

# Called by the Release workflow so a tag push produces one run covering every
# platform. Attaches nothing to the GitHub release — this leg only ships to
# TestFlight. Can also be dispatched on its own.

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_number:
        required: true
        type: string
  workflow_dispatch:

jobs:
  # ORPHEUS: TestFlight needs an App Store Connect API key and a fastlane match
  # repository. Without them the upload is skipped instead of failing the
  # release. See SYNC.md for the secrets to configure.
  gate:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_P8_KEY_CONTENT: ${{ secrets.APPSTORE_P8_KEY_CONTENT }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          GIT_AUTHORIZATION: ${{ secrets.GIT_AUTHORIZATION }}
        run: |
          if [ -n "$APPSTORE_KEY_ID" ] && [ -n "$APPSTORE_P8_KEY_CONTENT" ] \
             && [ -n "$MATCH_PASSWORD" ] && [ -n "$GIT_AUTHORIZATION" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::App Store Connect / match secrets are not configured; skipping TestFlight."
          fi

  build:
    needs: gate
    if: ${{ needs.gate.outputs.enabled == 'true' }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    env:
      APP_IDENTIFIER: ${{ vars.APP_IDENTIFIER }}
      APPLE_ID: ${{ vars.APPLE_ID }}
      ITC_TEAM_ID: ${{ vars.ITC_TEAM_ID }}
      TEAM_ID: ${{ vars.TEAM_ID }}
      APPSTORE_P8_KEY_CONTENT: ${{ secrets.APPSTORE_P8_KEY_CONTENT }}
      APPSTORE_KEY_ISSUER_ID: ${{ secrets.APPSTORE_KEY_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      GIT_USERNAME: ${{ vars.GIT_USERNAME }}
      GIT_AUTHORIZATION: ${{ secrets.GIT_AUTHORIZATION }}
      GIT_REPOSITORY: ${{ vars.GIT_REPOSITORY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      # fastlane treats an empty BUILD_VERSION as a real value, so it is only
      # written to the env when the caller actually passed one.
      - name: Resolve version
        working-directory: .
        env:
          IN_VERSION: ${{ inputs.version }}
          IN_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          echo "BUILD_NUMBER=${IN_BUILD_NUMBER:-$GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          if [ -n "$IN_VERSION" ]; then
            echo "BUILD_VERSION=$IN_VERSION" >> "$GITHUB_ENV"
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Build and upload to TestFlight
        run: bundle exec fastlane ios beta
