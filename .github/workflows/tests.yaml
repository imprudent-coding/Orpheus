name: orpheus
on: [push, workflow_dispatch]
jobs:
  drive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check the tree builds without the private package
        run: ./tool/check_public_pubspec.sh

      # ORPHEUS: the fork must not reintroduce the JellyBox cloud/relay.
      - name: No jellybox.app references
        run: ./tool/check_no_jellybox_app.sh

      - name: Get packages
        run: flutter pub get

      # ORPHEUS: upstream carries several hundred lint infos/warnings, so only
      # analyzer errors fail this step.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test

      - name: App tests
        run: flutter test

      # ORPHEUS: the mTLS package is held to a clean analysis.
      - name: mtls_proxy package analysis and tests
        working-directory: packages/mtls_proxy
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: optional_features package tests
        working-directory: packages/optional_features
        run: |
          dart pub get
          dart test
